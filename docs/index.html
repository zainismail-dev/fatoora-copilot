<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatoora Copilot · Demo</title>
<meta name="description" content="AI invoice assistant for Saudi finance teams: ZATCA pre-checks, duplicate detection, approvals and bank reconciliation. Demo with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="./styles.css?v=6">
</head>
<body data-view="overview">
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="17.5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="19" cy="19" r="13.5" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="1.5 2"/><path d="M12 22.5c2.2 1.6 5.5 1.9 8.3.6 2.6-1.2 4.3-3.7 4.4-6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="21" cy="12.6" r="1.5" fill="currentColor"/></svg>
      <div><b id="t-brand"></b><span id="t-tag"></span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot">
      <b id="t-co"></b>
      <div class="who-me"><span id="t-user"></span><button type="button" class="link" id="logout"></button></div>
    </div>
  </nav>

  <main class="main">
    <div class="content">
      <div class="topbar">
        <div class="crumb"><small id="t-date"></small><h1 id="t-page"></h1></div>
        <span class="demo" id="t-mode"></span>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" id="lang-ar" aria-pressed="true">عربي</button>
          <button type="button" id="lang-en" aria-pressed="false">English</button>
        </div>
        <button type="button" class="btn ink" id="open-agent"></button>
      </div>

      <section class="note" id="sec-overview" data-in="overview" aria-labelledby="hero-h">
        <canvas id="guilloche" aria-hidden="true"></canvas>
        <div>
          <h2 id="hero-h"></h2>
          <p id="hero-p"></p>
          <div class="acts">
            <button type="button" class="btn" id="go-desk"></button>
            <button type="button" class="btn ghost" id="upload-btn"></button>
          </div>
        </div>
        <div class="denom" aria-live="polite">
          <span class="corner" id="denom-corner"></span>
          <small id="denom-label"></small>
          <div><span class="big num" id="denom-big"></span><span class="unit" id="denom-unit"></span></div>
          <div class="under" id="denom-under"></div>
        </div>
      </section>

      <section class="pipe" id="pipe" data-in="overview" aria-label="Invoice pipeline"></section>

      <div class="board">
        <section class="panel" id="sec-ledger" data-in="invoices" aria-labelledby="ledger-h">
          <div class="ph"><h3 id="ledger-h"></h3><div class="chips" id="filters" role="group"></div></div>
          <div class="toolbar">
            <label class="search"><span class="sr" id="search-label"></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="ledger-search" autocomplete="off" aria-labelledby="search-label"></label>
            <span class="count-note" id="ledger-count"></span>
            <button type="button" class="btn" id="export-csv"></button>
          </div>
          <div class="scroll"><table><thead><tr id="thead"></tr></thead><tbody id="ledger"></tbody></table></div>
        </section>
        <section class="panel" id="sec-desk" data-in="overview approvals" aria-labelledby="desk-h">
          <div class="ph"><h3 id="desk-h"></h3><span class="sub" id="desk-sub"></span></div>
          <ul class="desk" id="desk"></ul>
          <div class="dfoot" id="desk-foot"></div>
        </section>
        <section class="panel" id="sec-spend" data-in="overview spend" aria-labelledby="spend-h">
          <div class="ph"><h3 id="spend-h"></h3><button type="button" class="chip" id="spend-toggle" aria-pressed="false"></button></div>
          <div id="spend"></div>
          <div class="vatline" id="vatline"></div>
        </section>
        <section id="sec-recon" data-in="reconcile" aria-label="Bank reconciliation"></section>
        <section class="panel" id="sec-intake" data-in="intake" aria-labelledby="intake-h">
          <div class="ph"><h3 id="intake-h"></h3></div>
          <div class="intake">
            <div id="inbox-box"></div>
            <label class="drop" id="drop" for="file-in">
              <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 17v-6M9.5 13.5 12 11l2.5 2.5"/></svg>
              <b id="t-drop"></b><span id="t-drop2"></span>
            </label>
            <input type="file" id="file-in" class="sr" accept=".pdf,image/png,image/jpeg,image/webp">
            <p class="fine" id="t-dropnote"></p>
          </div>
        </section>
      </div>

      <footer id="t-foot"></footer>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-title" hidden>
  <div class="vhead"><h3 id="v-title"></h3><button type="button" class="btn" id="v-close"></button></div>
  <div class="vbody" id="vbody"></div>
</section>

<section class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="agent-h" hidden>
  <div class="dh"><h3 id="agent-h"></h3><button type="button" class="btn" id="close-agent"></button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="sugg" id="sugg"></div>
  <form class="ask" id="ask-form"><label class="sr" for="ask-input" id="ask-label"></label><input id="ask-input" autocomplete="off"><button type="submit" class="btn solid" id="ask-send"></button></form>
</section>

<div class="toast" id="toast" role="status" hidden></div>
<script src="./demo.js"></script>
<script src="./i18n.js?v=6"></script>
<script src="./assistant.js?v=6"></script>
<script src="./app.js?v=6"></script>
<script src="./reconcile.js?v=6"></script>
<script src="./recon.js?v=6"></script>
</body>
</html>
