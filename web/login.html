<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatoora Copilot · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="/static/styles.css?v=4">
<style>
  .signin{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr)}
  .signin .note{border-radius:0;align-content:center;grid-template-columns:minmax(0,1fr);padding:48px max(32px,6vw)}
  .signin .note h2{font-size:42px}
  .signin form{align-self:center;justify-self:center;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;padding:32px 24px}
  .signin form h1{margin:0 0 6px;font-family:var(--display);font-size:28px}
  .signin label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-soft)}
  .signin input{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px 12px;font:inherit;color:var(--ink)}
  .signin .btn{justify-content:center;padding:10px 14px}
  .signin .err{color:var(--flag);font-size:14px;min-height:1.4em;margin:0}
  .signin .seg{align-self:flex-start}
  @media (max-width:820px){.signin{grid-template-columns:minmax(0,1fr)}.signin .note{padding:32px 20px}.signin .note h2{font-size:30px}}
</style>
</head>
<body>
<div class="signin">
  <section class="note">
    <canvas id="guilloche" aria-hidden="true"></canvas>
    <div>
      <h2 id="l-head"></h2>
      <p id="l-sub"></p>
    </div>
  </section>
  <form id="login" novalidate>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lang-ar" aria-pressed="true">عربي</button><button type="button" id="lang-en" aria-pressed="false">English</button></div>
    <h1 id="l-title"></h1>
    <label><span id="l-email"></span><input id="email" type="email" autocomplete="username" dir="ltr" required></label>
    <label><span id="l-pass"></span><input id="password" type="password" autocomplete="current-password" dir="ltr" required></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" class="btn solid" id="l-btn"></button>
  </form>
</div>
<script>
(function(){
  const W = {
    ar:{head:"فواتير الموردين، مفحوصة قبل أن تصل إليك",sub:"يقرأ فاتورة كوبايلت الفواتير بالعربية والإنجليزية، ويفحصها وفق قواعد الزكاة والضريبة، ويرسلها للاعتماد.",title:"تسجيل الدخول",email:"البريد الإلكتروني",pass:"كلمة المرور",btn:"ادخل",bad:"البريد أو كلمة المرور غير صحيحة.",many:"محاولات كثيرة. انتظر 15 دقيقة ثم حاول مجدداً.",down:"تعذّر الوصول إلى الخادم."},
    en:{head:"Supplier invoices, checked before they reach you",sub:"Fatoora Copilot reads invoices in Arabic and English, checks them against ZATCA rules and sends them for approval.",title:"Sign in",email:"Email",pass:"Password",btn:"Sign in",bad:"Wrong email or password.",many:"Too many attempts. Wait 15 minutes, then try again.",down:"Can't reach the server."}
  };
  let lang = "ar"; try { const s = localStorage.getItem("fc-lang"); if (s === "en" || s === "ar") lang = s; } catch (e) {}
  const $ = (id) => document.getElementById(id);
  function paint(){
    const w = W[lang]; document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("l-head").textContent = w.head; $("l-sub").textContent = w.sub; $("l-title").textContent = w.title;
    $("l-email").textContent = w.email; $("l-pass").textContent = w.pass; $("l-btn").textContent = w.btn;
    $("lang-ar").setAttribute("aria-pressed", String(lang === "ar")); $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    draw();
  }
  function draw(){
    const c = $("guilloche"), r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = r.width * dpr; c.height = r.height * dpr; const g = c.getContext("2d"); g.scale(dpr, dpr);
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--note-line").trim(); g.lineWidth = .8;
    const cx = r.width * .5, cy = r.height * .78;
    [[120,44,70,1.3,9],[96,34,52,1.3,7]].forEach(([R,rr,d,s,turns]) => { g.beginPath(); for (let i = 0; i <= turns * 360; i++) { const a = i * Math.PI / 180, x = (R-rr)*Math.cos(a)+d*Math.cos((R-rr)/rr*a), y = (R-rr)*Math.sin(a)-d*Math.sin((R-rr)/rr*a); i ? g.lineTo(cx+x*s, cy+y*s) : g.moveTo(cx+x*s, cy+y*s); } g.stroke(); });
  }
  $("lang-ar").onclick = () => { lang = "ar"; try { localStorage.setItem("fc-lang", lang); } catch (e) {} paint(); };
  $("lang-en").onclick = () => { lang = "en"; try { localStorage.setItem("fc-lang", lang); } catch (e) {} paint(); };
  $("login").addEventListener("submit", async (e) => {
    e.preventDefault(); $("err").textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
      if (r.ok) { location.href = "/"; return; }
      $("err").textContent = r.status === 429 ? W[lang].many : W[lang].bad;
    } catch (err) { $("err").textContent = W[lang].down; }
  });
  addEventListener("resize", draw);
  paint(); $("email").focus();
})();
</script>
</body>
</html>
