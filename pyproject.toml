[project]
name = "fatoora-copilot"
version = "1.0.0"
description = "AI accounts-payable assistant for Saudi finance teams: invoice reading, ZATCA pre-checks and approvals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Zain Ismail" }]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
